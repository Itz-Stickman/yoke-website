<script>
(() => {
  const box = document.getElementById('releases');
  const CHEVRON = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>';
  const fmtDate = (iso) => {
    if (!iso) return '';
    const d = new Date(iso + 'T12:00:00Z');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  };
  const slug = (v) => 'v' + v.replace(/\./g, '-');
  const kindOf = (heading) => /fix/i.test(heading) ? 'fixed' : /add|new/i.test(heading) ? 'added' : /change|improve/i.test(heading) ? 'changed' : 'other';
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  // Appends text to a node, turning **bold** spans into <strong>. Never parses HTML.
  const richText = (node, text) => {
    text.split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
      if (part) node.appendChild(i % 2 ? el('strong', null, part) : document.createTextNode(part));
    });
  };

  function render(list) {
    const openNow = new Set([...box.querySelectorAll('details[open]')].map((d) => d.id));
    const wanted = location.hash.slice(1);
    box.innerHTML = '';
    list.forEach((r, i) => {
      const d = el('details', 'release');
      d.id = slug(r.version);
      d.open = openNow.size ? openNow.has(d.id) : (wanted ? wanted === d.id : i === 0);

      const s = el('summary');
      s.appendChild(el('span', 'r-ver', r.version));
      if (i === 0) s.appendChild(el('span', 'badge', 'Latest'));
      if (r.prerelease) s.appendChild(el('span', 'badge pre', 'Pre-release'));
      if (r.notes.length) s.appendChild(el('span', 'r-count', r.notes.reduce((n, sec) => n + sec.items.length, 0) + ' changes'));
      const date = el('time', 'r-date', fmtDate(r.date));
      date.dateTime = r.date;
      s.appendChild(date);
      s.insertAdjacentHTML('beforeend', CHEVRON);
      d.appendChild(s);

      const body = el('div', 'r-body');
      if (r.notes.length) {
        r.notes.forEach((sec) => {
          const wrap = el('div', 'r-sec');
          wrap.dataset.kind = kindOf(sec.heading);
          if (sec.heading) wrap.appendChild(el('h3', null, sec.heading));
          const ul = el('ul');
          sec.items.forEach((it) => {
            const li = el('li');
            const text = el('div', 'r-text');
            richText(text, it.text);
            if (it.sub.length) {
              const sub = el('ul', 'r-sub');
              // One wrapper per sub-item: the li is a grid, so bare text and <strong> would split into cells.
              it.sub.forEach((t) => { const s = el('li'); const span = el('span'); richText(span, t); s.appendChild(span); sub.appendChild(s); });
              text.appendChild(sub);
            }
            li.appendChild(text);
            ul.appendChild(li);
          });
          wrap.appendChild(ul);
          body.appendChild(wrap);
        });
      } else {
        body.appendChild(el('p', 'r-empty', 'No notes for this release.'));
      }
      const links = el('div', 'r-links');
      if (r.setupUrl) { const a = el('a', null, 'Download installer'); a.href = r.setupUrl; a.target = '_blank'; a.rel = 'noopener'; links.appendChild(a); }
      if (r.portableUrl) { const a = el('a', null, 'Portable version'); a.href = r.portableUrl; a.target = '_blank'; a.rel = 'noopener'; links.appendChild(a); }
      const gh = el('a', null, 'View on GitHub'); gh.href = r.pageUrl; gh.target = '_blank'; gh.rel = 'noopener'; links.appendChild(gh);
      body.appendChild(links);
      d.appendChild(body);
      box.appendChild(d);
    });
    if (wanted && document.getElementById(wanted)) document.getElementById(wanted).scrollIntoView();
  }

  render(YokeReleases.fallback);
  YokeReleases.load().then((list) => { render(list); YokeReleases.applyDownloads(list); }).catch(() => {});
})();
</script>
